<!DOCTYPE html>
<html>
<head>
  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      overflow: hidden;
    }
    
    /* Compact Glass Card - No Drop Shadow */
    .glass-card {
      background: rgba(216, 164, 166, 0.75); /* Default Dirty Pink */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-bottom: 1px solid rgba(138, 90, 93, 0.2);
      border-right: 1px solid rgba(138, 90, 93, 0.2);
      border-radius: 20px;
      padding: 14px 18px; /* Compact padding */
      box-shadow: none;   /* Removed drop shadow */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;           /* Tight spacing */
    }

    /* Scaled Down Clock Face */
    .clock {
      width: 90px;
      height: 90px;
      position: relative;
    }

    /* Hour Tick Lines */
    .ticks {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }
    .tick {
      position: absolute;
      width: 1.5px;
      height: 6px;
      background: rgba(74, 48, 50, 0.35);
      left: 50%;
      top: 0;
      transform-origin: 50% 45px;
      margin-left: -0.75px;
      border-radius: 1px;
    }
    .tick.major {
      width: 2px;
      height: 8px;
      background: rgba(74, 48, 50, 0.65);
      margin-left: -1px;
    }

    /* Center Pin */
    .clock::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: #4a3032;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    /* Hands */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 3px;
      z-index: 5;
    }
    
    .hour {
      width: 3px;
      height: 24px;
      background: #4a3032;
      margin-left: -1.5px;
    }
    
    .minute {
      width: 2px;
      height: 34px;
      background: #6e4446;
      margin-left: -1px;
    }
    
    .second {
      width: 1px;
      height: 38px;
      background: #ffffff;
      margin-left: -0.5px;
      z-index: 6;
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
    }

    /* Smaller Digital Time Display */
    .digital {
      color: #3b2426;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      background: rgba(255, 255, 255, 0.3);
      padding: 3px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="clock">
      <div class="ticks" id="ticks"></div>
      <div class="hand hour" id="hr"></div>
      <div class="hand minute" id="min"></div>
      <div class="hand second" id="sec"></div>
    </div>
    <div class="digital" id="digital"></div>
  </div>

  <script>
    // Read hex color code from URL parameter (?bg=hexcode)
    const urlParams = new URLSearchParams(window.location.search);
    const bgParam = urlParams.get('bg');

    if (bgParam) {
      const hex = bgParam.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      
      document.querySelector('.glass-card').style.background = `rgba(${r}, ${g}, ${b}, 0.75)`;
    }

    // Generate 12 hour tick marks
    const ticksContainer = document.getElementById('ticks');
    for (let i = 0; i < 12; i++) {
      const tick = document.createElement('div');
      tick.className = i % 3 === 0 ? 'tick major' : 'tick';
      tick.style.transform = `rotate(${i * 30}deg)`;
      ticksContainer.appendChild(tick);
    }

    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();
      const ms = now.getMilliseconds();
      
      const hrDeg = (h % 12) * 30 + m * 0.5 + (s / 120);
      const minDeg = m * 6 + (s / 10);
      const secDeg = s * 6 + (ms * 0.006);
      
      document.getElementById('hr').style.transform = `rotate(${hrDeg}deg)`;
      document.getElementById('min').style.transform = `rotate(${minDeg}deg)`;
      document.getElementById('sec').style.transform = `rotate(${secDeg}deg)`;
      
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('digital').innerText = timeString;
      
      requestAnimationFrame(updateClock);
    }
    
    requestAnimationFrame(updateClock);
  </script>
</body>
</html>
