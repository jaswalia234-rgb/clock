<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Google Font: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: "proxima-nova", "Proxima Nova", "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    
    /* Exact Glass Card Styling */
    .glass-card {
      background: rgba(174, 205, 230, 0.75); /* Dusty Blue */
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 3px solid rgba(255, 255, 255, 0.75);
      border-bottom: 3px solid rgba(110, 145, 170, 0.3);
      border-right: 3px solid rgba(110, 145, 170, 0.3);
      border-radius: 26px;
      padding: 16px 20px;
      width: 178px;
      height: 182px;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
    }

    /* Location Name */
    .location {
      color: #3a546e;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Weather Icon & Main Temp Display */
    .weather-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .weather-icon {
      font-size: 34px;
      line-height: 1;
    }

    .temp {
      color: #1e3246;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    /* Condition Description */
    .condition {
      color: #1e3246;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-align: center;
      white-space: nowrap;
    }

    /* High / Low Range */
    .temp-range {
      color: #3a546e;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="location" id="city">LOADING...</div>
    <div class="weather-main">
      <div class="weather-icon" id="icon">☀️</div>
      <div class="temp" id="temp">--&deg;</div>
    </div>
    <div class="condition" id="condition">Fetching Weather</div>
    <div class="temp-range" id="range">H: --&deg; L: --&deg;</div>
  </div>

  <script>
    // URL color override support (?bg=hexcode)
    const urlParams = new URLSearchParams(window.location.search);
    const bgParam = urlParams.get('bg');

    if (bgParam) {
      const hex = bgParam.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      
      document.querySelector('.glass-card').style.background = `rgba(${r}, ${g}, ${b}, 0.75)`;
    }

    // WMO Weather interpretation map
    function getWeatherDetails(code) {
      if (code === 0) return { desc: "Clear Sky", icon: "☀️" };
      if ([1, 2, 3].includes(code)) return { desc: "Partly Cloudy", icon: "⛅" };
      if ([45, 48].includes(code)) return { desc: "Foggy", icon: "🌫️" };
      if ([51, 53, 55, 61, 63, 65].includes(code)) return { desc: "Rainy", icon: "🌧️" };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { desc: "Snow", icon: "❄️" };
      if ([80, 81, 82].includes(code)) return { desc: "Showers", icon: "🌦️" };
      if ([95, 96, 99].includes(code)) return { desc: "Thunderstorm", icon: "⛈️" };
      return { desc: "Clear", icon: "🌤️" };
    }

    async function fetchWeather() {
      try {
        // High-precision location detection via ipapi
        const locRes = await fetch('https://ipapi.co/json/');
        const locData = await locRes.json();
        const city = locData.city || locData.region || "London";
        const lat = locData.latitude || 51.5074;
        const lon = locData.longitude || -0.1278;

        document.getElementById('city').innerText = city.toUpperCase();

        // Query Open-Meteo high-resolution best-match model
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
        const weatherData = await weatherRes.json();

        const currentTemp = Math.round(weatherData.current.temperature_2m);
        const code = weatherData.current.weather_code;
        const maxTemp = Math.round(weatherData.daily.temperature_2m_max[0]);
        const minTemp = Math.round(weatherData.daily.temperature_2m_min[0]);
        
        const details = getWeatherDetails(code);

        // Update elements using clean HTML entities
        document.getElementById('temp').innerHTML = `${currentTemp}&deg;`;
        document.getElementById('condition').innerText = details.desc;
        document.getElementById('icon').innerText = details.icon;
        document.getElementById('range').innerHTML = `H: ${maxTemp}&deg;  L: ${minTemp}&deg;`;

      } catch (err) {
        document.getElementById('city').innerText = "LONDON";
        document.getElementById('temp').innerHTML = "18&deg;";
        document.getElementById('condition').innerText = "Partly Cloudy";
        document.getElementById('icon').innerText = "⛅";
        document.getElementById('range').innerHTML = "H: 21&deg;  L: 14&deg;";
      }
    }

    fetchWeather();
  </script>
</body>
</html>
