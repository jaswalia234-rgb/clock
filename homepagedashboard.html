<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Google Font: Outfit (fallback matching Proxima Nova / Sans-Serif style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Dusty Blue Glass Banner (3000px x 100px aspect ratio container) */
    .banner-card {
      background: rgba(174, 205, 230, 0.75); /* Dusty Blue */
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 3px solid rgba(255, 255, 255, 0.75);
      border-bottom: 3px solid rgba(110, 145, 170, 0.3);
      border-right: 3px solid rgba(110, 145, 170, 0.3);
      border-radius: 26px; /* Matching rounded corners as clock card */
      
      width: 100%;
      max-width: 3000px;
      height: 100px;
      
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
      padding: 0 32px;
    }

    /* Lowercase Dashboard Title matching image typography */
    .banner-title {
      color: #1e3246; /* Matching dark slate text color from blue clock */
      font-family: "Playfair Display", "proxima-nova", "Proxima Nova", Georgia, serif;
      font-size: 38px;
      font-weight: 400;
      letter-spacing: -0.5px;
      text-transform: lowercase;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="banner-card">
    <h1 class="banner-title">homepage dashboard</h1>
  </div>

  <script>
    // URL color override support (?bg=hexcode)
    const urlParams = new URLSearchParams(window.location.search);
    const bgParam = urlParams.get('bg');

    if (bgParam) {
      const hex = bgParam.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      
      document.querySelector('.banner-card').style.background = `rgba(${r}, ${g}, ${b}, 0.75)`;
    }
  </script>
</body>
</html>
