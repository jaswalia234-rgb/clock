<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Google Font: Outfit (Proxima Nova / Sans-Serif style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Dusty Blue Glass Banner with Two-Toned Glass Bezel */
    .banner-card {
      background: rgba(174, 205, 230, 0.75); /* Dusty Blue #AECDE6 */
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      
      /* Two-Toned Glass Bezel Border */
      border: 3px solid rgba(255, 255, 255, 0.75); /* Top-left light highlight */
      border-bottom: 3px solid rgba(110, 145, 170, 0.35); /* Bottom-right dark shadow */
      border-right: 3px solid rgba(110, 145, 170, 0.35);
      
      border-radius: 26px; /* Matching rounded corners as clock */
      
      width: 100%;
      max-width: 3000px;
      height: 100px;
      
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
      padding: 0 32px;
    }

    /* Lowercase Title Matching Typography */
    .banner-title {
      color: #1e3246; /* Dark Slate */
      font-family: "proxima-nova", "Proxima Nova", "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: lowercase;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="banner-card">
    <h1 class="banner-title">homepage dashboard</h1>
  </div>

  <script>
    // URL parameter support for dynamic hex colors (?bg=hexcode)
    const urlParams = new URLSearchParams(window.location.search);
    const bgParam = urlParams.get('bg');

    if (bgParam) {
      const hex = bgParam.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      
      document.querySelector('.banner-card').style.background = `rgba(${r}, ${g}, ${b}, 0.75)`;
    }
  </script>
</body>
</html>
